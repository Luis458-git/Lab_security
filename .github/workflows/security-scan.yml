name: 🛡️ Escaneo de Seguridad OWASP ZAP (Cloud DAST)

# ==============================================================================
# Escaneo Dinámico de Seguridad (DAST) con OWASP ZAP
# Se ejecuta 100% en los servidores de GitHub sin necesidad de instalar Docker en tu PC.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL pública de tu aplicación en Render'
        required: true
        default: 'https://tu-app.onrender.com'

jobs:
  zap_scan:
    name: 🔍 OWASP ZAP Container Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Despertar la app en Render (Wake-up Ping)
        run: |
          echo "Despertando el servicio en Render por si está en modo reposo..."
          curl -s -i "${{ github.event.inputs.target_url }}/health" || true
          sleep 10

      - name: Ejecutar Contenedor Docker de OWASP ZAP en la Nube
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ github.event.inputs.target_url }}
          allow_issue_writing: false
          fail_action: false

      - name: Publicar Reporte Forense en Resumen de GitHub
        if: always()
        run: |
          if [ -f report_md.md ]; then
            echo "### 🛡️ Reporte Completo de Ciberseguridad OWASP ZAP" >> $GITHUB_STEP_SUMMARY
            cat report_md.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Guardar Reporte HTML y JSON como Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-owasp-zap-dast
          path: |
            report_html.html
            report_md.md
            report_json.json
