name: 🛡️ Escaneo de Seguridad OWASP ZAP (Cloud DAST)

# ==============================================================================
# Escaneo Dinámico de Seguridad (DAST) con OWASP ZAP
# Se ejecuta 100% en los servidores de GitHub sin necesidad de instalar Docker en tu PC.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL pública de tu aplicación en Render'
        required: true
        default: 'https://securevault-adn6.onrender.com'

jobs:
  zap_scan:
    name: 🔍 OWASP ZAP Container Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Despertar la app en Render (Wake-up Ping)
        run: |
          echo "Despertando el servicio en Render por si está en modo reposo..."
          curl -k -s -i "${{ github.event.inputs.target_url }}/health" || true
          sleep 10

      - name: Ejecutar Contenedor Docker de OWASP ZAP (Cloud DAST)
        run: |
          echo "Iniciando contenedor oficial ghcr.io/zaproxy/zaproxy:stable..."
          mkdir -p zap-reports
          chmod 777 zap-reports

          docker run --user root --rm -v $(pwd)/zap-reports:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ github.event.inputs.target_url }}" \
            -I \
            -r report_html.html \
            -w report_md.md \
            -J report_json.json || true

          echo "Escaneo completado. Verificando archivos generados:"
          ls -la zap-reports/

      - name: Publicar Reporte Forense en Resumen de GitHub
        if: always()
        run: |
          if [ -f zap-reports/report_md.md ]; then
            echo "### 🛡️ Reporte Completo de Ciberseguridad OWASP ZAP" >> $GITHUB_STEP_SUMMARY
            cat zap-reports/report_md.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ No se generó reporte Markdown de ZAP" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Guardar Reporte HTML y JSON como Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-owasp-zap-dast
          path: zap-reports/
          if-no-files-found: warn
